<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synodic</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <img src="../../icons/icon48.png" width="32" height="32" alt="" />
          <h1>Synodic</h1>
        </div>
        <div id="connection" class="connection" hidden>
          <span id="connection-label"></span>
        </div>
      </header>

      <section id="start-view" class="view start-view">
        <div class="action-panel">
          <button id="create" class="button button-primary button-wide" type="button">
            Создать комнату
          </button>

          <div class="divider"><span>или войдите по коду</span></div>

          <form id="join-form" class="join-form">
            <label class="join-label" for="code">Код комнаты</label>
            <p id="join-feedback" class="join-note" role="status" aria-live="polite" hidden></p>
            <div class="code-field">
              <input
                id="code"
                class="code-input"
                inputmode="text"
                enterkeyhint="go"
                maxlength="4"
                autocomplete="off"
                spellcheck="false"
                placeholder="ABCD"
                aria-describedby="join-feedback"
              />
              <button id="join" class="join-go" type="submit" aria-label="Войти" title="Войти">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 5v6a3 3 0 0 1-3 3H6" />
                  <path d="m9.5 10.5-3.5 3.5 3.5 3.5" />
                </svg>
              </button>
            </div>
          </form>
        </div>

        <p class="scope-note">Откройте страницу с видео — комната привяжется только к этой вкладке.</p>
      </section>

      <section id="room-view" class="view room-view" hidden>
        <div class="room-summary">
          <p id="room-eyebrow" class="eyebrow">Ваша комната</p>
          <h2 id="room-title">Осталось дождаться второго</h2>
          <p id="room-description" class="room-description" hidden></p>
        </div>

        <div class="room-share">
          <span class="share-label">Код комнаты</span>
          <button id="copy" class="room-invite" type="button" aria-label="Скопировать код комнаты" title="Скопировать код комнаты">
            <span id="room-code" class="room-code">····</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <g class="copy-glyph">
                <rect x="8" y="8" width="11" height="11" rx="2" />
                <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
              </g>
              <path class="check-glyph" d="m6 12 4 4 8-9" />
            </svg>
          </button>
        </div>

        <div class="room-actions">
          <button id="select-tab" class="button button-secondary" type="button" hidden>
            Выбрать эту вкладку
          </button>

          <button id="ready" class="button button-primary" type="button" hidden>
            Смотреть вместе
          </button>

          <button id="leave" class="button button-quiet button-danger" type="button">Покинуть</button>
        </div>
      </section>

      <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
    </main>

    <script src="../shared/config.js"></script>
    <script src="../shared/protocol.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
